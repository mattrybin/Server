name: Scan ports

on:
  push:
    branches: [development]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan ports
        id: scan_ports
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            nmap -sS -T5 -p- --min-rate 1000 localhost
            nmap -sV -sC -p 22,80,443,3200,3301,4000,4317,4318,5432,6111,8000,8080,8443,44315 localhost
            ss -tulpn | grep -E "(22|80|443|3200|3301|4000|4317|4318|5432|6111|8000|8080|8443|44315)"
            lsof -i -P -n | grep LISTEN


