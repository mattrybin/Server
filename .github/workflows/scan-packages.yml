name: Complete Package Inventory

on:
  push:
    branches: [development]

jobs:
  package-inventory-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Package Inventory Script
        id: scan_packages_step
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            #!/bin/bash

            echo "=========================================="
            echo "  ENHANCED PACKAGE INVENTORY WITH DATES"
            echo "=========================================="
            echo "Generated at: $(date)"
            echo "System: $(lsb_release -d 2>/dev/null | cut -f2 || cat /etc/debian_version)"
            echo

            # Update package cache first
            echo "Updating package cache..."
            sudo apt update >/dev/null 2>&1
            echo "Cache updated."
            echo

            # Function to get human readable size
            human_size() {
                local size=$1
                if [ "$size" -gt 1073741824 ]; then
                    echo "$(( size / 1073741824 ))GB"
                elif [ "$size" -gt 1048576 ]; then
                    echo "$(( size / 1048576 ))MB"
                elif [ "$size" -gt 1024 ]; then
                    echo "$(( size / 1024 ))KB"
                else
                    echo "${size}B"
                fi
            }

            # Function to check if version is newer
            is_newer_version() {
                local current="$1"
                local available="$2"
                dpkg --compare-versions "$available" gt "$current" 2>/dev/null
            }

            # Function to get package date from apt-cache
            get_package_date() {
                local package="$1"
                local version="$2"
                
                # Try to get date from apt-cache show
                local date_info=$(apt-cache show "$package=$version" 2>/dev/null | grep "^Date:" | head -1 | cut -d' ' -f2-)
                
                if [ -z "$date_info" ]; then
                    # Fallback to general package info
                    date_info=$(apt-cache show "$package" 2>/dev/null | grep "^Date:" | head -1 | cut -d' ' -f2-)
                fi
                
                echo "$date_info"
            }

            # Function to calculate days between dates
            calculate_age_days() {
                local date1="$1"  # older date
                local date2="$2"  # newer date
                
                if [ -n "$date1" ] && [ -n "$date2" ]; then
                    local epoch1=$(date -d "$date1" +%s 2>/dev/null)
                    local epoch2=$(date -d "$date2" +%s 2>/dev/null)
                    
                    if [ -n "$epoch1" ] && [ -n "$epoch2" ]; then
                        local diff=$(( (epoch2 - epoch1) / 86400 ))
                        echo "$diff"
                    else
                        echo "N/A"
                    fi
                else
                    echo "N/A"
                fi
            }

            # Function to format date nicely
            format_date() {
                local date_str="$1"
                if [ -n "$date_str" ]; then
                    date -d "$date_str" "+%Y-%m-%d" 2>/dev/null || echo "$date_str"
                else
                    echo "N/A"
                fi
            }

            echo "=========================================="
            echo "         PACKAGE SUMMARY STATISTICS"
            echo "=========================================="

            echo "=== PACKAGE COUNTS ==="
            total_packages=$(dpkg -l | grep -c '^ii')
            upgradable_count=$(apt list --upgradable 2>/dev/null | grep -c upgradable)
            auto_count=$(apt-mark showauto | wc -l)
            manual_count=$(apt-mark showmanual | wc -l)

            echo "Total installed packages: $total_packages"
            echo "Upgradable packages: $upgradable_count"
            echo "Automatically installed: $auto_count"
            echo "Manually installed: $manual_count"
            echo

            echo "=== TOTAL DISK USAGE ==="
            total_size=$(dpkg-query -Wf '${Installed-Size}\n' | awk '{sum+=$1} END {print sum*1024}')
            echo "Total installed size: $(human_size $total_size)"
            echo

            echo "=== LARGEST PACKAGES (Top 20) ==="
            dpkg-query -Wf '${Installed-Size}\t${Package}\t${Version}\n' | sort -nr | head -20 | while read size package version; do
                size_bytes=$((size * 1024))
                printf "%-15s %-40s %s\n" "$(human_size $size_bytes)" "$package" "$version"
            done
            echo

            echo "=========================================="
            echo "        PACKAGE DATE ANALYSIS"
            echo "=========================================="

            echo "=== UPGRADABLE PACKAGES WITH DATE INFO ==="
            echo "Format: PACKAGE | CURRENT_VERSION | AVAILABLE_VERSION | CURRENT_DATE | AVAILABLE_DATE | AGE_DIFF"
            echo "=========================================================================================="

            apt list --upgradable 2>/dev/null | grep -v "^Listing" | while IFS='/' read package rest; do
                if [ -n "$package" ]; then
                    current_version=$(dpkg-query -Wf '${Version}' "$package" 2>/dev/null)
                    available_version=$(apt-cache policy "$package" 2>/dev/null | grep "Candidate:" | awk '{print $2}')
                    
                    # Get dates
                    current_date=$(get_package_date "$package" "$current_version")
                    available_date=$(get_package_date "$package" "$available_version")
                    
                    # Format dates
                    current_formatted=$(format_date "$current_date")
                    available_formatted=$(format_date "$available_date")
                    
                    # Calculate age difference
                    age_diff=$(calculate_age_days "$current_date" "$available_date")
                    if [ "$age_diff" != "N/A" ] && [ "$age_diff" -gt 0 ]; then
                        age_display="${age_diff} days newer"
                    elif [ "$age_diff" != "N/A" ] && [ "$age_diff" -lt 0 ]; then
                        age_display="$((-age_diff)) days older"
                    else
                        age_display="N/A"
                    fi
                    
                    printf "%-25s | %-20s | %-20s | %-12s | %-12s | %s\n" \
                        "$package" \
                        "$current_version" \
                        "$available_version" \
                        "$current_formatted" \
                        "$available_formatted" \
                        "$age_display"
                fi
            done | head -30
            echo "... (showing first 30 upgradable packages with date info)"
            echo

            echo "=== RECENTLY UPDATED PACKAGES (Last 30 days) ==="
            current_date=$(date +%s)
            thirty_days_ago=$((current_date - 2592000))

            dpkg -l | grep '^ii' | awk '{print $2}' | head -50 | while read package; do
                version=$(dpkg-query -Wf '${Version}' "$package" 2>/dev/null)
                pkg_date=$(get_package_date "$package" "$version")
                
                if [ -n "$pkg_date" ]; then
                    pkg_epoch=$(date -d "$pkg_date" +%s 2>/dev/null)
                    if [ -n "$pkg_epoch" ] && [ "$pkg_epoch" -gt "$thirty_days_ago" ]; then
                        formatted_date=$(format_date "$pkg_date")
                        days_ago=$(( (current_date - pkg_epoch) / 86400 ))
                        printf "%-30s %-20s %-12s (%d days ago)\n" "$package" "$version" "$formatted_date" "$days_ago"
                    fi
                fi
            done | head -20
            echo

            echo "=========================================="
            echo "         ENHANCED PACKAGE LISTING"
            echo "=========================================="

            echo "Creating comprehensive package report with dates..."
            echo "Format: PACKAGE | INSTALLED_VERSION | LATEST_AVAILABLE | SIZE | STATUS | INSTALL_DATE | AVAILABLE_DATE"
            echo "======================================================================================================="

            # Create temporary file for processing
            temp_file=$(mktemp)
            date_temp=$(mktemp)

            # Get all installed packages with enhanced info
            dpkg -l | grep '^ii' | awk '{print $2}' | while read package; do
                # Get current installed version
                current_version=$(dpkg-query -Wf '${Version}' "$package" 2>/dev/null)
                
                # Get installed size
                installed_size=$(dpkg-query -Wf '${Installed-Size}' "$package" 2>/dev/null)
                size_human=$(human_size $((installed_size * 1024)))
                
                # Get available versions from apt
                policy_output=$(apt-cache policy "$package" 2>/dev/null)
                candidate_version=$(echo "$policy_output" | grep "Candidate:" | awk '{print $2}')
                
                # Get package dates
                current_date=$(get_package_date "$package" "$current_version")
                available_date=$(get_package_date "$package" "$candidate_version")
                current_formatted=$(format_date "$current_date")
                available_formatted=$(format_date "$available_date")
                
                # Determine status
                status="CURRENT"
                if [ "$candidate_version" != "$current_version" ] && [ -n "$candidate_version" ] && [ "$candidate_version" != "(none)" ]; then
                    if is_newer_version "$current_version" "$candidate_version"; then
                        status="UPDATE_AVAILABLE"
                    fi
                fi
                
                printf "%-30s | %-20s | %-20s | %-8s | %-15s | %-12s | %-12s\n" \
                    "$package" \
                    "$current_version" \
                    "${candidate_version:-N/A}" \
                    "$size_human" \
                    "$status" \
                    "$current_formatted" \
                    "$available_formatted"
                    
            done | tee "$temp_file" | head -50
            echo "... (showing first 50 packages - full report saved to temp file)"
            echo

            echo "=========================================="
            echo "         SECURITY UPDATE ANALYSIS"
            echo "=========================================="

            echo "=== SECURITY UPDATES AVAILABLE ==="
            apt list --upgradable 2>/dev/null | grep -i security | head -20 || echo "No obvious security updates found in upgrade list"
            echo

            echo "=== PACKAGES FROM SECURITY REPOSITORY ==="
            apt-cache policy | grep -A 1 security | head -20 || echo "No security repositories configured"
            echo

            echo "=== SECURITY UPDATE DATES ==="
            apt list --upgradable 2>/dev/null | grep -i security | head -10 | while IFS='/' read package rest; do
                if [ -n "$package" ]; then
                    available_version=$(apt-cache policy "$package" 2>/dev/null | grep "Candidate:" | awk '{print $2}')
                    available_date=$(get_package_date "$package" "$available_version")
                    formatted_date=$(format_date "$available_date")
                    echo "$package: $available_version ($formatted_date)"
                fi
            done
            echo

            echo "=========================================="
            echo "         PACKAGE SOURCE ANALYSIS"
            echo "=========================================="

            echo "=== PACKAGES BY REPOSITORY ==="
            dpkg -l | grep '^ii' | awk '{print $2}' | head -50 | while read package; do
                origin=$(apt-cache policy "$package" 2>/dev/null | grep "^ \*\*\*" -A 1 | tail -1 | awk '{print $2}' | head -1)
                echo "$package: $origin"
            done | sort -k2 | uniq -f1 -c | sort -nr | head -10
            echo "... (showing top 10 repository sources for first 50 packages)"
            echo

            echo "=== NON-OFFICIAL PACKAGES ==="
            dpkg -l | grep '^ii' | awk '{print $2}' | while read package; do
                policy=$(apt-cache policy "$package" 2>/dev/null)
                if echo "$policy" | grep -q "now.*local\|now.*unknown"; then
                    version=$(dpkg-query -Wf '${Version}' "$package" 2>/dev/null)
                    pkg_date=$(get_package_date "$package" "$version")
                    formatted_date=$(format_date "$pkg_date")
                    echo "$package ($version) - locally installed or unknown source [$formatted_date]"
                fi
            done | head -20
            echo

            echo "=========================================="
            echo "         PACKAGE MAINTENANCE INFO"
            echo "=========================================="

            echo "=== PACKAGES THAT CAN BE REMOVED ==="
            echo "--- Automatically installed and no longer needed ---"
            apt autoremove --dry-run 2>/dev/null | grep "^Remv" | head -10 || echo "No packages marked for autoremoval"
            echo

            echo "--- Orphaned packages (deborphan if available) ---"
            if command -v deborphan >/dev/null 2>&1; then
                deborphan | head -10 || echo "No orphaned packages found"
            else
                echo "deborphan not installed (install with: sudo apt install deborphan)"
            fi
            echo

            echo "=== INSTALLATION HISTORY WITH DATES ==="
            echo "--- Recently installed packages ---"
            grep "install " /var/log/dpkg.log 2>/dev/null | tail -10 | while read date time action package version; do
                echo "$date $time: $package ($version)"
            done || echo "Cannot access dpkg log"
            echo

            echo "--- Recently upgraded packages ---"
            grep "upgrade " /var/log/dpkg.log 2>/dev/null | tail -10 | while read date time action package old_version new_version; do
                echo "$date $time: $package ($old_version -> $new_version)"
            done || echo "Cannot access dpkg log"
            echo

            echo "=========================================="
            echo "         ENHANCED ANALYSIS SUMMARY"
            echo "=========================================="

            # Enhanced analysis of the temp file
            if [ -f "$temp_file" ]; then
                echo "=== PACKAGE STATUS BREAKDOWN ==="
                update_count=$(grep "UPDATE_AVAILABLE" "$temp_file" | wc -l)
                current_count=$(grep "CURRENT" "$temp_file" | wc -l)
                echo "Packages needing updates: $update_count"
                echo "Packages current: $current_count"
                echo "Update percentage: $(( update_count * 100 / (update_count + current_count) ))%"
                echo
                
                echo "=== SIZE ANALYSIS ==="
                large_packages=$(awk -F'|' '{print $4}' "$temp_file" | grep -c "GB\|[0-9][0-9][0-9]MB")
                medium_packages=$(awk -F'|' '{print $4}' "$temp_file" | grep -c "GB\|[0-9][0-9]MB\|[0-9][0-9][0-9]MB")
                echo "Packages > 100MB: $large_packages"
                echo "Packages > 10MB: $medium_packages"
                echo
                
                echo "=== DATE ANALYSIS ==="
                echo "Packages with available date info: $(awk -F'|' '$7 !~ /N\/A/ {count++} END {print count+0}' "$temp_file")"
                echo "Packages missing date info: $(awk -F'|' '$7 ~ /N\/A/ {count++} END {print count+0}' "$temp_file")"
                
                rm "$temp_file"
            fi

            echo
            echo "=== ENHANCED MAINTENANCE RECOMMENDATIONS ==="
            echo "1. Run 'sudo apt upgrade' to update $upgradable_count packages"
            echo "2. Check packages with large age differences for security implications"
            echo "3. Run 'sudo apt autoremove' to clean up unneeded packages"
            echo "4. Run 'sudo apt autoclean' to clear package cache"
            echo "5. Consider reviewing packages without date information"
            echo "6. Monitor packages from non-official sources"
            echo "7. Set up automatic security updates for critical packages"
            echo

            echo "=========================================="
            echo "Enhanced package inventory completed at $(date)"
            echo "=========================================="

            echo
            echo "=== USEFUL FOLLOW-UP COMMANDS ==="
            echo "# Check package changelog for dates:"
            echo "apt-cache changelog <package-name>"
            echo
            echo "# Get detailed package dates:"
            echo "apt-cache show <package-name> | grep Date"
            echo
            echo "# List packages by installation date:"
            echo "grep 'install ' /var/log/dpkg.log | tail -20"
            echo
            echo "# Check specific package policy and dates:"
            echo "apt-cache policy <package-name>"
            echo
            echo "# Find when a package was last updated:"
            echo "stat /var/lib/dpkg/info/<package-name>.list"

      - name: Save Script Output
        if: always()
        run: |
          echo "Saving script stdout to package_scan_output.txt"
          echo "${{ steps.scan_packages_step.outputs.stdout }}" > package_scan_output.txt
          echo "Saving script stderr to package_scan_error.txt"
          echo "${{ steps.scan_packages_step.outputs.stderr }}" > package_scan_error.txt
          touch package_scan_output.txt package_scan_error.txt # Ensure files exist for artifact upload
          echo "Contents of package_scan_output.txt (first 5 lines):"
          head -n 5 package_scan_output.txt
          echo "Contents of package_scan_error.txt (first 5 lines):"
          head -n 5 package_scan_error.txt

      - name: Upload Package Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-scan-results-${{ github.run_number }}
          path: |
            package_scan_output.txt
            package_scan_error.txt
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Complete Package Inventory scan failed. Check the logs for details."
          echo "::error::Complete Package Inventory workflow failed"