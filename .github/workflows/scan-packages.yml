name: Simplified Package Inventory

on:
  push:
    branches: [development]

jobs:
  package-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Package JSON
        id: scan_packages_step
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            #!/bin/bash
            set -o pipefail
            
            # Ensure jq is installed
            if ! command -v jq &> /dev/null; then
              echo "jq not found. Installing jq..." >&2
              sudo apt-get update >/dev/null 2>&1
              sudo apt-get install -y jq >/dev/null 2>&1
              echo "jq installed." >&2
            else
              echo "jq is already installed." >&2
            fi

            TMP_JSON_FILE=$(mktemp)

            # Update package cache
            echo "Updating package cache (apt update)..." >&2
            sudo apt update >/dev/null 2>&1
            echo "Package cache updated." >&2

            echo "Generating package list in JSON format..." >&2

            # Count total packages for progress reporting
            TOTAL_PACKAGES=$(dpkg-query -W -f='${Package}\n' | wc -l)
            echo "Total packages to process: $TOTAL_PACKAGES" >&2
            
            # Generate JSON using a more reliable approach
            # Process each package individually to avoid multi-line issues
            COUNTER=0
            {
              dpkg-query -W -f='${Package}\n' | while read -r pkg_name; do
                if [ -z "$pkg_name" ]; then
                  continue
                fi

                COUNTER=$((COUNTER + 1))
                
                # Show progress every 50 packages
                if [ $((COUNTER % 50)) -eq 0 ]; then
                  echo "Progress: $COUNTER/$TOTAL_PACKAGES packages processed..." >&2
                fi

                # Get package details individually - query each field separately to avoid parsing issues
                inst_ver=$(dpkg-query -W -f='${Version}' "$pkg_name" 2>/dev/null || true)
                size_kb_str=$(dpkg-query -W -f='${Installed-Size}' "$pkg_name" 2>/dev/null || true)

                # Get available version with error handling
                avail_ver_output=""
                apt_cache_output=$(apt-cache policy "$pkg_name" 2>/dev/null || true)
                if [ -n "$apt_cache_output" ]; then
                  avail_ver_output=$(echo "$apt_cache_output" | grep "Candidate:" | awk '{print $2}' || true)
                fi

                # Prepare available version for JSON
                if [ -n "$avail_ver_output" ] && [ "$avail_ver_output" != "(none)" ]; then
                  avail_ver_jq_val=$(jq -n --arg s "$avail_ver_output" '$s')
                else
                  avail_ver_jq_val="null"
                fi

                # Prepare size_kb for JSON
                if [[ "$size_kb_str" =~ ^[0-9]+$ ]]; then
                  size_kb_jq_val="$size_kb_str"
                else
                  size_kb_jq_val="null"
                fi
                
                # Output JSON object for this package (without description)
                jq -c -n \
                  --arg pn "$pkg_name" \
                  --arg iv "$inst_ver" \
                  --argjson av "$avail_ver_jq_val" \
                  --argjson skb "$size_kb_jq_val" \
                  '{package_name: $pn, installed_version: $iv, available_version: $av, size_kb: $skb}'
              done
              
              echo "All $COUNTER packages processed successfully." >&2
            } | jq -s 'if length == 0 then [] else . end' > "$TMP_JSON_FILE"

            echo "Package list generated on remote server." >&2

            # Output the JSON content
            cat "$TMP_JSON_FILE"

            # Clean up
            rm -f "$TMP_JSON_FILE"

      - name: Save Package JSON to Runner
        run: |
          echo "Saving script stdout to packages.json on the runner..."
          # Use printf with %s to preserve exact content
          printf '%s' "${{ steps.scan_packages_step.outputs.stdout }}" > packages.json
          
          echo "File size: $(wc -c < packages.json) bytes"
          
          echo "JSON validation check:"
          if jq empty packages.json 2>/dev/null; then
            echo "✓ Valid JSON"
            echo "Package count: $(jq 'length' packages.json)"
            echo "Sample packages (first 3):"
            jq '.[0:3]' packages.json 2>/dev/null || echo "No packages found"
          else
            echo "✗ Invalid JSON detected!"
            echo "First 1000 characters:"
            head -c 1000 packages.json
            echo
            echo "Last 1000 characters:"
            tail -c 1000 packages.json
            exit 1
          fi

      - name: Upload Package JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-inventory-${{ github.run_number }}
          path: packages.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Simplified Package Inventory generation failed. Check the logs for details."
          echo "::error::Simplified Package Inventory workflow failed"