name: Linux CIS Benchmark Scan

on:
  push:
    branches: [development]

jobs:
  linux-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, centos]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run linux-bench CIS scan in ${{ matrix.distro }} container
        run: |
          set -e 
          set -o pipefail

          DOCKER_IMAGE=""
          PRE_INSTALL_CMDS=""
          INSTALL_PACKAGES_CMD=""
          OS_VERSION_CMD=""

          if [ "${{ matrix.distro }}" == "ubuntu" ]; then
            DOCKER_IMAGE="ubuntu:latest"
            PRE_INSTALL_CMDS="echo '>>> Attempting to remove apt lock files...'; \
                              rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock; \
                              echo 'Lock file removal attempted.'; \
                              echo '>>> Cleaning apt cache...'; \
                              apt-get clean; \
                              echo 'Apt cache cleaned.';"
            INSTALL_PACKAGES_CMD="apt-get update -y && apt-get install -y sudo curl git golang-go"
            OS_VERSION_CMD="cat /etc/os-release"
          elif [ "${{ matrix.distro }}" == "debian" ]; then
            DOCKER_IMAGE="debian:latest"
            PRE_INSTALL_CMDS="echo '>>> Attempting to remove apt lock files...'; \
                              rm -f /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock; \
                              echo 'Lock file removal attempted.'; \
                              echo '>>> Cleaning apt cache...'; \
                              apt-get clean; \
                              echo 'Apt cache cleaned.';"
            INSTALL_PACKAGES_CMD="apt-get update -y && apt-get install -y sudo curl git golang-go"
            OS_VERSION_CMD="cat /etc/os-release"
          elif [ "${{ matrix.distro }}" == "centos" ]; then
            DOCKER_IMAGE="centos:latest"
            INSTALL_PACKAGES_CMD="dnf update -y && dnf install -y sudo curl git golang findutils" # findutils for xargs in some go tools
            OS_VERSION_CMD="cat /etc/centos-release || cat /etc/redhat-release"
          else
            echo "Unsupported distribution: ${{ matrix.distro }}"
            exit 1
          fi

          echo ">>> Starting scan for ${{ matrix.distro }} using ${DOCKER_IMAGE}"

          docker run --rm -v "$PWD:/scan_ws" -w /scan_ws "$DOCKER_IMAGE" /bin/bash -c "
            set -e
            set -o pipefail

            echo '>>> Running inside Docker container for ${{ matrix.distro }}'
            echo '>>> OS Version:'
            ${OS_VERSION_CMD}
            
            if [ -n \"${PRE_INSTALL_CMDS}\" ]; then
              eval \"${PRE_INSTALL_CMDS}\"
            fi

            echo '>>> Installing dependencies...'
            ${INSTALL_PACKAGES_CMD}
            echo 'Dependencies installed.'

            echo '>>> Ensuring Go is installed...'
            if ! command -v go &> /dev/null; then
              echo 'Go not found after package installation. This should not happen.'
              exit 1
            else
              echo \"Go is installed: \$(go version)\"
            fi

            export GOPATH=\${GOPATH:-\$HOME/go}
            export PATH=\$PATH:\$GOPATH/bin:/usr/local/go/bin
            mkdir -p \"\$GOPATH/src\" \"\$GOPATH/bin\"
            echo \"GOPATH configured: \$GOPATH\"
            echo \"PATH updated: \$PATH\"

            echo '>>> Fetching aquasecurity/linux-bench...'
            if go install github.com/aquasecurity/linux-bench@latest; then
              echo 'linux-bench installed successfully.'
            else
              echo 'ERROR: Failed to install linux-bench. Exiting.'
              exit 1
            fi
            
            # Verify linux-bench is in GOPATH/bin
            if [ ! -f \"\$GOPATH/bin/linux-bench\" ]; then
                echo \"ERROR: linux-bench not found in \$GOPATH/bin after installation.\"
                ls -la \$GOPATH/bin
                exit 1
            fi

            echo '>>> Running linux-bench scan (default CIS version)...'
            if sudo \$GOPATH/bin/linux-bench; then
              echo 'linux-bench scan completed.'
            else
              echo 'WARNING: linux-bench scan reported issues or encountered an error during its execution.'
            fi

            echo '>>> Linux Bench script finished for ${{ matrix.distro }}.'
          "
          echo ">>> Scan finished for ${{ matrix.distro }}"