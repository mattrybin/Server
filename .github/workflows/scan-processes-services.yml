name: Complete Process and Service Audit

on:
  push:
    branches: [development]

jobs:
  process-service-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Process and Service Audit Script
        id: run_audit_script_step
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            #!/bin/bash
            # Complete Process and Service Audit Script
            # Shows all running processes, services, and identifies potential security concerns

            echo "=========================================="
            echo "   COMPLETE PROCESS & SERVICE AUDIT"
            echo "=========================================="
            echo "Generated at: $(date)"
            echo "Hostname: $(hostname)"
            echo "Uptime: $(uptime)"
            echo

            # Function to highlight suspicious processes
            check_suspicious() {
                local process="$1"
                local warnings=""
                
                # Check for common suspicious indicators
                if echo "$process" | grep -q -E "(bitcoin|miner|crypto|xmrig|cpuminer)"; then
                    warnings="$warnings [CRYPTO-MINING?] "
                fi
                if echo "$process" | grep -q -E "(\\.tmp/|\\.cache/|/dev/shm/)"; then
                    warnings="$warnings [TEMP-LOCATION] "
                fi
                if echo "$process" | grep -q -E "(nc|netcat|ncat).*-l"; then
                    warnings="$warnings [LISTENING-NETCAT] "
                fi
                if echo "$process" | grep -q -E "python.*-c|perl.*-e|bash.*-c.*base64"; then
                    warnings="$warnings [INLINE-CODE] "
                fi
                
                if [ -n "$warnings" ]; then
                    echo "⚠️  $warnings"
                fi
            }

            echo "=========================================="
            echo "         SYSTEM RESOURCE OVERVIEW"
            echo "=========================================="

            echo "=== CPU AND MEMORY USAGE ==="
            echo "Load Average: $(cat /proc/loadavg)"
            echo "CPU Info: $(grep -c ^processor /proc/cpuinfo) cores, $(grep "model name" /proc/cpuinfo | head -1 | cut -d: -f2 | xargs)"
            echo
            free -h
            echo

            echo "=== TOP RESOURCE CONSUMERS ==="
            echo "--- TOP 10 BY CPU ---"
            ps aux --sort=-%cpu | head -11 | while IFS= read line; do
                echo "$line"
                if [ "$line" != "$(ps aux | head -1)" ]; then
                    check_suspicious "$line"
                fi
            done
            echo

            echo "--- TOP 10 BY MEMORY ---"
            ps aux --sort=-%mem | head -11 | while IFS= read line; do
                echo "$line"
                if [ "$line" != "$(ps aux | head -1)" ]; then
                    check_suspicious "$line"
                fi
            done
            echo

            echo "=========================================="
            echo "           SYSTEMD SERVICES"
            echo "=========================================="

            echo "=== SYSTEMD SERVICE STATUS OVERVIEW ==="
            systemctl --type=service --state=running --no-pager --no-legend | wc -l | xargs echo "Running services:"
            systemctl --type=service --state=failed --no-pager --no-legend | wc -l | xargs echo "Failed services:"
            systemctl --type=service --state=inactive --no-pager --no-legend | wc -l | xargs echo "Inactive services:"
            echo

            echo "=== RUNNING SERVICES ==="
            systemctl --type=service --state=running --no-pager
            echo

            echo "=== FAILED SERVICES ==="
            systemctl --type=service --state=failed --no-pager
            if [ $(systemctl --type=service --state=failed --no-pager --no-legend | wc -l) -gt 0 ]; then
                echo
                echo "--- Failed Service Details ---"
                systemctl --type=service --state=failed --no-pager --no-legend | while read service rest; do
                    echo "=== $service ==="
                    systemctl status "$service" --no-pager --lines=5
                    echo
                done
            fi

            echo "=== ENABLED SERVICES (AUTO-START) ==="
            systemctl list-unit-files --type=service --state=enabled --no-pager | head -20
            echo "... (showing first 20, use 'systemctl list-unit-files --type=service --state=enabled' for complete list)"
            echo

            echo "=========================================="
            echo "         DETAILED PROCESS ANALYSIS"
            echo "=========================================="

            echo "=== ALL PROCESSES BY USER ==="
            ps aux --sort=user | awk 'NR==1 {print $0} NR>1 {if ($1 != prev) {print "--- User: " $1 " ---"} print $0; prev=$1}'
            echo

            echo "=== PROCESS TREE ==="
            pstree -p | head -30
            echo "... (showing first 30 lines, use 'pstree -p' for complete tree)"
            echo

            echo "=== PROCESSES BY START TIME ==="
            echo "--- Recently Started (last 30) ---"
            ps -eo pid,ppid,user,lstart,cmd --sort=lstart | tail -30
            echo

            echo "=== LONG-RUNNING PROCESSES ==="
            echo "--- Oldest Processes ---"
            ps -eo pid,ppid,user,etime,cmd --sort=etime | tail -20
            echo

            echo "=========================================="
            echo "         NETWORK & CONNECTIONS"
            echo "=========================================="

            echo "=== LISTENING PORTS ==="
            echo "--- TCP Listening ---"
            ss -tlnp | head -20
            echo
            echo "--- UDP Listening ---"
            ss -ulnp | head -10
            echo

            echo "=== ACTIVE NETWORK CONNECTIONS ==="
            echo "--- Established TCP Connections ---"
            ss -tnp state established | head -15
            echo

            echo "=== PROCESSES WITH NETWORK ACTIVITY ==="
            lsof -i -n | head -20 2>/dev/null || echo "lsof not available or no network connections"
            echo

            echo "=========================================="
            echo "         SECURITY ANALYSIS"
            echo "=========================================="

            echo "=== PROCESSES RUNNING AS ROOT ==="
            ps aux | awk '$1=="root" {print $2, $11}' | head -20
            echo "... (showing first 20 root processes)"
            echo

            echo "=== SUSPICIOUS PROCESS PATTERNS ==="
            echo "--- Processes with unusual names ---"
            ps aux | grep -E "(^|\s)[a-zA-Z]{1,2}$|^\s*[0-9]+\s+[^a-zA-Z]|tmp|cache" | head -10 || echo "No obviously suspicious process names found"
            echo

            echo "--- Processes running from unusual locations ---"
            ps aux | grep -E "(tmp|cache|dev/shm|var/tmp)" | head -10 || echo "No processes from suspicious locations found"
            echo

            echo "--- Python/Bash/Perl with inline code ---"
            ps aux | grep -E "(python.*-c|bash.*-c|perl.*-e)" | head -10 || echo "No inline code execution found"
            echo

            echo "=== PROCESSES WITHOUT TTY (DAEMONS/BACKGROUND) ==="
            ps aux | awk '$7=="?" {print $1, $2, $11}' | head -15
            echo "... (these are normal for daemons, but check for unknown ones)"
            echo

            echo "=== FILE DESCRIPTORS AND OPEN FILES ==="
            echo "--- Processes with most open files ---"
            lsof 2>/dev/null | awk '{print $2}' | sort | uniq -c | sort -nr | head -10 | while read count pid; do
                if [ "$pid" != "PID" ] && [ -n "$pid" ]; then
                    cmd=$(ps -p "$pid" -o comm= 2>/dev/null)
                    echo "$count open files - PID $pid ($cmd)"
                fi
            done
            echo

            echo "=========================================="
            echo "           STARTUP PROCESSES"
            echo "=========================================="

            echo "=== INIT SYSTEM PROCESSES ==="
            ps aux | awk '$2==1 || $3==1 {print $0}'
            echo

            echo "=== KERNEL THREADS ==="
            ps aux | awk '$11 ~ /^\[.*\]$/ {print $2, $11}' | head -15
            echo "... (these are normal kernel threads)"
            echo

            echo "=========================================="
            echo "         PROCESS SUMMARY & WARNINGS"
            echo "=========================================="

            echo "=== PROCESS COUNTS ==="
            echo "Total processes: $(ps aux | wc -l)"
            echo "Root processes: $(ps aux | awk '$1=="root"' | wc -l)"
            echo "User processes: $(ps aux | awk '$1!="root" && NR>1' | wc -l)"
            echo "Processes with children: $(pstree -p | grep -o '([0-9]*)' | wc -l)"
            echo

            echo "=== RESOURCE USAGE SUMMARY ==="
            echo "Processes using >10% CPU:"
            ps aux --sort=-%cpu | awk 'NR>1 && $3>10 {print $1, $2, $3"% CPU", $11}' | head -5
            echo
            echo "Processes using >10% Memory:"
            ps aux --sort=-%mem | awk 'NR>1 && $4>10 {print $1, $2, $4"% MEM", $11}' | head -5
            echo

            echo "=== POTENTIAL SECURITY CONCERNS ==="
            echo "⚠️  REVIEW THESE MANUALLY:"
            echo
            echo "1. Check any unknown processes running as root"
            echo "2. Verify processes listening on network ports"
            echo "3. Investigate processes from /tmp or /dev/shm locations"
            echo "4. Review any failed systemd services"
            echo "5. Check processes with inline code execution"
            echo

            echo "=== RECOMMENDED ACTIONS ==="
            echo "• Run 'systemctl status <service>' for any failed services"
            echo "• Use 'lsof -p <PID>' to see what files a suspicious process has open"
            echo "• Use 'strace -p <PID>' to see what a process is doing (be careful!)"
            echo "• Check '/proc/<PID>/exe' to see the actual executable path"
            echo "• Use 'netstat -tulpn' or 'ss -tulpn' for detailed network listening"
            echo

            echo "=========================================="
            echo "Process and service audit completed at $(date)"
            echo "=========================================="

      - name: Save Script Output
        if: always()
        run: |
          echo "Saving script stdout to process_service_audit_output.txt"
          echo "${{ steps.run_audit_script_step.outputs.stdout }}" > process_service_audit_output.txt
          echo "Saving script stderr to process_service_audit_error.txt"
          echo "${{ steps.run_audit_script_step.outputs.stderr }}" > process_service_audit_error.txt
          touch process_service_audit_output.txt process_service_audit_error.txt

      - name: Upload Audit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-service-audit-results-${{ github.run_number }}
          path: |
            process_service_audit_output.txt
            process_service_audit_error.txt
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Process and Service Audit scan failed. Check the logs for details."
          echo "::error::Process and Service Audit workflow failed"